<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写汉字 Writing exercises</title>
    <!-- LXGW WenKai provides a Kai-style Chinese font on phones that lack a built-in KaiTi font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            margin: 0; min-height: 100vh; background: #f7f3e8;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex; justify-content: center; align-items: center; padding: 8px;
        }
        .app {
            width: 100%; max-width: 500px; background: #fff9f0;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1), 0 4px 12px rgba(0, 0, 0, 0.06);
            padding: 20px 16px 28px; border: 1px solid #e6d9c8;
        }
        h1 {
            text-align: center; font-size: 1.7rem; font-weight: 400;
            color: #4e3e2e; margin: 0 0 6px 0; letter-spacing: 1px; line-height: 1.3;
        }
        h1 .cn { font-family: 'KaiTi', '楷体', 'STKaiti', '华文楷体', 'LXGW WenKai', 'Noto Serif SC', serif; }
        h1 .en { font-size: 1.3rem; color: #8e7a66; display: block; margin-top: 2px; }
        .subhead {
            text-align: center; font-size: 0.9rem; color: #a18e78;
            margin-bottom: 16px; font-style: italic;
        }
        .character-display {
            display: flex; justify-content: center; align-items: baseline;
            gap: 12px; margin: 8px 0 14px; flex-wrap: wrap;
        }
        .character-display span {
            font-size: 3.8rem; line-height: 1.2; color: #4e3e2e; font-weight: 400;
            font-family: 'KaiTi', '楷体', 'STKaiti', '华文楷体', 'LXGW WenKai', 'Noto Serif SC', serif;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.02);
        }
        .character-display .star {
            font-size: 1.8rem; color: #d4a373; vertical-align: super;
            margin-left: -6px; font-family: sans-serif;
        }
        .character-display .pinyin {
            font-size: 1rem; color: #b7a48e; font-style: italic;
            margin-left: 4px; font-family: 'Segoe UI', 'PingFang SC', sans-serif;
        }
        .canvas-wrapper {
            position: relative; width: 100%; aspect-ratio: 1 / 1;
            margin: 8px 0 16px; border-radius: 36px; background: #fefcf9;
            box-shadow: inset 0 0 0 1px #e6d9c8, 0 8px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden; touch-action: none;
        }
        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: block; touch-action: none; cursor: crosshair; border-radius: 36px;
        }
        #guideCanvas { pointer-events: none; z-index: 2; opacity: 0.4; }
        #debugCanvas {
            pointer-events: none; z-index: 4; opacity: 0;
            transition: opacity 0.25s ease;
        }
        #debugCanvas.visible { opacity: 1; }
        #drawCanvas { z-index: 3; background: transparent; }
        .word-selector {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 8px; margin: 14px 0 12px;
        }
        .word-btn {
            position: relative; background: #fff3e6; border: 1.5px solid #dccfbe;
            color: #4e3e2e; font-size: 1.6rem; width: 62px; height: 62px;
            border-radius: 24px; display: flex; align-items: center; justify-content: center;
            font-family: 'KaiTi', '楷体', 'STKaiti', '华文楷体', 'LXGW WenKai', 'Noto Serif SC', serif;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            transition: all 0.1s ease; touch-action: manipulation; cursor: pointer;
        }
        .word-btn .challenge-star {
            position: absolute; top: -4px; right: -4px;
            font-size: 1rem; color: #d4a373; line-height: 1;
        }
        .word-btn.active {
            background: #d9c8b2; border-color: #b8a28a; color: #2f241b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); transform: scale(0.98);
        }
        .word-btn:active { background: #d9c8b2; }
        .actions { display: flex; justify-content: space-between; gap: 12px; margin: 10px 0 6px; }
        .btn {
            flex: 1; padding: 16px 0; font-size: 1.1rem; font-weight: 500;
            border: none; border-radius: 60px; background: #e6d9c8; color: #4e3e2e;
            letter-spacing: 1px; box-shadow: 0 4px 0 #cbb9a6;
            transition: all 0.08s ease; touch-action: manipulation; cursor: pointer;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #cbb9a6; }
        .btn.primary { background: #b8a28a; color: #fff9f0; box-shadow: 0 4px 0 #8e7a66; }
        .btn.primary:active { box-shadow: 0 1px 0 #8e7a66; }
        .score-panel {
            text-align: center; margin-top: 18px; padding: 12px 8px;
            background: #f3ede5; border-radius: 40px;
            display: flex; justify-content: space-around; align-items: center;
        }
        .score-item { display: flex; flex-direction: column; align-items: center; }
        .score-label {
            font-size: 0.8rem; text-transform: uppercase; color: #a18e78; letter-spacing: 2px;
        }
        .score-value { font-size: 2.2rem; font-weight: 600; color: #4e3e2e; line-height: 1.2; }
        .score-value small { font-size: 1rem; font-weight: 400; color: #b7a48e; }
        .feedback {
            font-size: 0.95rem; color: #8e7a66; min-height: 2.6rem;
            margin: 10px 0 0; text-align: center; font-style: italic;
            line-height: 1.5; padding: 0 8px;
        }
        .stroke-info {
            font-size: 0.85rem; color: #a18e78; text-align: center;
            margin: 4px 0 0; font-style: normal; line-height: 1.5;
        }
        .stroke-info .stroke-number { font-weight: 600; color: #6b5b4b; }
        .hint {
            font-size: 0.8rem; text-align: center; color: #c2b2a0; margin: 12px 0 0;
        }


        /* Responsive layout: stacked on phones, side-by-side on wider screens. */
        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding: clamp(6px, 1.5vw, 18px);
            overflow-x: hidden;
        }

        .app {
            width: min(100%, 1240px);
            max-width: none;
            margin: auto;
            padding: clamp(12px, 2.5vw, 30px);
            border-radius: clamp(22px, 4vw, 48px) clamp(22px, 4vw, 48px) clamp(18px, 3vw, 32px) clamp(18px, 3vw, 32px);
        }

        .app-header { margin-bottom: clamp(12px, 2vh, 22px); }
        h1 { font-size: clamp(1.35rem, 2.5vw, 1.9rem); }
        h1 .en { font-size: clamp(1rem, 1.7vw, 1.3rem); }
        .subhead {
            font-size: clamp(0.78rem, 1.2vw, 0.9rem);
            margin: 4px 0 0;
        }

        .main-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            align-items: start;
            gap: clamp(12px, 2vh, 20px);
        }
        .drawing-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }
        .controls-area {
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.4vh, 14px);
            min-width: 0;
        }

        .character-display {
            margin: 0 0 clamp(6px, 1.2vh, 12px);
            gap: clamp(8px, 1.5vw, 12px);
        }
        .character-display span { font-size: clamp(2.8rem, 7vw, 3.8rem); }
        .character-display .star { font-size: 1.8rem; }
        .character-display .pinyin { font-size: 1rem; }

        .canvas-wrapper {
            width: min(100%, 68vh);
            width: min(100%, 68dvh);
            margin: 0;
            border-radius: clamp(18px, 3vw, 36px);
        }
        canvas { border-radius: clamp(18px, 3vw, 36px); }

        .word-selector {
            justify-content: center;
            gap: clamp(6px, 1vw, 10px);
            margin: 0;
        }
        .word-btn {
            width: clamp(46px, 5.2vw, 62px);
            height: clamp(46px, 5.2vw, 62px);
            border-radius: clamp(16px, 2vw, 24px);
            font-size: clamp(1.3rem, 2vw, 1.6rem);
        }
        .actions { gap: clamp(8px, 1.2vw, 12px); margin: 0; }
        .btn {
            padding: clamp(10px, 1.5vh, 16px) 0;
            font-size: clamp(0.95rem, 1.4vw, 1.1rem);
        }
        .score-panel {
            margin: 0;
            padding: clamp(8px, 1.4vh, 12px) 8px;
        }
        .score-value { font-size: clamp(1.7rem, 3vw, 2.2rem); }
        .feedback { margin: 0; min-height: 0; }
        .stroke-info { margin: 0; }
        .hint { margin: 0; }

        @media (min-width: 800px) {
            .app-header { margin-bottom: clamp(14px, 2.2vh, 24px); }
            .main-layout {
                grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
                gap: clamp(24px, 3.5vw, 48px);
                align-items: center;
            }
            .drawing-area { align-items: center; }
            .canvas-wrapper { width: min(100%, 68vh); width: min(100%, 68dvh); }
            .controls-area { gap: clamp(10px, 1.7vh, 16px); }
            .word-selector { justify-content: flex-start; }
            .character-display { margin-bottom: clamp(10px, 1.5vh, 16px); }
        }

        @media (max-width: 380px) {
            body { padding: 4px; }
            .app { padding: 12px 10px 16px; }
            .word-btn { width: 42px; height: 42px; border-radius: 14px; }
            .word-selector { gap: 6px; }
            .score-label { letter-spacing: 1px; }
        }

        @media (max-height: 560px) and (min-width: 700px) {
            .app { padding: 12px 16px; }
            .app-header { margin-bottom: 8px; }
            .main-layout { gap: 18px; }
            .canvas-wrapper { width: min(100%, 56vh); width: min(100%, 56dvh); }
            .controls-area { gap: 6px; }
            .score-panel { padding: 6px 8px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="app-header">
        <h1>
            <span class="cn">写汉字</span>
            <span class="en">Writing exercises</span>
        </h1>
        <div class="subhead">✍️ Trace the grey strokes with your finger</div>
    </header>

    <main class="main-layout">
        <section class="drawing-area" aria-label="Chinese character writing area">
            <div class="character-display">
                <span id="currentCharDisplay">日</span>
                <span class="star" id="starDisplay" style="display: none;">★</span>
                <span class="pinyin" id="pinyinDisplay">rì</span>
            </div>

            <div class="canvas-wrapper">
                <canvas id="guideCanvas"></canvas>
                <canvas id="drawCanvas" aria-label="Draw the Chinese character here"></canvas>
                <canvas id="debugCanvas"></canvas>
            </div>
        </section>

        <section class="controls-area" aria-label="Writing exercise controls">
            <div class="word-selector" id="wordSelector"></div>

            <div class="actions">
                <button class="btn" id="clearBtn" type="button">Clear</button>
                <button class="btn primary" id="checkBtn" type="button">Score</button>
            </div>

            <div class="score-panel">
                <div class="score-item">
                    <span class="score-label">Accuracy</span>
                    <span class="score-value" id="scoreDisplay">—<small>%</small></span>
                </div>
                <div class="score-item">
                    <span class="score-label">Strokes</span>
                    <span class="score-value" id="strokeCount">0</span>
                </div>
            </div>
            <div class="feedback" id="feedbackMsg">Tap "Score" to see your accuracy</div>
            <div class="stroke-info" id="strokeInfo"></div>
            <div class="hint">💡 Follow the grey stroke paths as closely as possible</div>
        </section>
    </main>
</div>
<script>
    (function() {
        const CHARACTERS = [
            { char: '日', pinyin: 'rì', challenge: false, strokeCount: 4,
              strokeOrder: '1. Vertical 丨  2. Horizontal fold ㇕  3. Horizontal 一  4. Horizontal 一' },
            { char: '月', pinyin: 'yuè', challenge: false, strokeCount: 4,
              strokeOrder: '1. Left-falling 丿  2. Horizontal fold hook ㇆  3. Horizontal 一  4. Horizontal 一' },
            { char: '水', pinyin: 'shuǐ', challenge: false, strokeCount: 4,
              strokeOrder: '1. Vertical hook 亅  2. Horizontal撇 ㇇  3. Left-falling 丿  4. Right-falling ㇏' },
            { char: '火', pinyin: 'huǒ', challenge: false, strokeCount: 4,
              strokeOrder: '1. Dot 丶  2. Left-falling 丿  3. Right-falling ㇏  4. Dot 丶' },
            { char: '早', pinyin: 'zǎo', challenge: false, strokeCount: 6,
              strokeOrder: '1. Vertical 丨  2. Horizontal fold ㇕  3. Horizontal 一  4. Horizontal 一  5. Vertical 丨  6. Horizontal 一' },
            { char: '我', pinyin: 'wǒ', challenge: true, strokeCount: 7,
              strokeOrder: '1. Left-falling 丿  2. Horizontal 一  3. Vertical hook 亅  4. Lift ㇀  5. Slant hook ㇂  6. Left-falling 丿  7. Dot 丶' },
            { char: '你', pinyin: 'nǐ', challenge: true, strokeCount: 7,
              strokeOrder: '1. Left-falling 丿  2. Vertical 丨  3. Left-falling 丿  4. Dot 丶  5. Slant hook ㇂  6. Vertical hook 亅  7. Dot 丶' }
        ];

        let currentIndex = 0;
        let currentChar = CHARACTERS[currentIndex].char;

        const guideCanvas = document.getElementById('guideCanvas');
        const drawCanvas = document.getElementById('drawCanvas');
        const debugCanvas = document.getElementById('debugCanvas');
        const currentCharDisplay = document.getElementById('currentCharDisplay');
        const starDisplay = document.getElementById('starDisplay');
        const pinyinDisplay = document.getElementById('pinyinDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const strokeCountSpan = document.getElementById('strokeCount');
        const feedbackMsg = document.getElementById('feedbackMsg');
        const strokeInfo = document.getElementById('strokeInfo');
        const wordSelector = document.getElementById('wordSelector');
        const clearBtn = document.getElementById('clearBtn');
        const checkBtn = document.getElementById('checkBtn');

        let guideCtx = guideCanvas.getContext('2d');
        let drawCtx = drawCanvas.getContext('2d');
        let debugCtx = debugCanvas.getContext('2d');

        let canvasWidth = 0, canvasHeight = 0;
        let dpr = window.devicePixelRatio || 1;
        let previousCssWidth = 0, previousCssHeight = 0;

        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let strokePoints = [];
        let allStrokes = [];

        let debugVisible = false;
        let debugTimer = null;

        const KAI_FONT_STACK = '"KaiTi", "楷体", "STKaiti", "华文楷体", "LXGW WenKai", "Noto Serif SC", "Songti SC", serif';
        const COMP_SIZE = 200;

        // ---------- Canvas sizing ----------
        function resizeCanvas() {
            const wrapper = guideCanvas.parentElement;
            const rect = wrapper.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            if (!width || !height) return;

            dpr = window.devicePixelRatio || 1;

            // Scale existing points proportionally so drawings survive resize/orientation changes.
            if (previousCssWidth > 0 && previousCssHeight > 0 &&
                (Math.abs(width - previousCssWidth) > 0.5 || Math.abs(height - previousCssHeight) > 0.5)) {
                const scaleX = width / previousCssWidth;
                const scaleY = height / previousCssHeight;
                for (const stroke of allStrokes) {
                    for (const point of stroke) {
                        point.x *= scaleX;
                        point.y *= scaleY;
                    }
                }
                lastX *= scaleX;
                lastY *= scaleY;
            }
            previousCssWidth = width;
            previousCssHeight = height;

            guideCanvas.style.width = width + 'px';
            guideCanvas.style.height = height + 'px';
            drawCanvas.style.width = width + 'px';
            drawCanvas.style.height = height + 'px';
            debugCanvas.style.width = width + 'px';
            debugCanvas.style.height = height + 'px';

            const pixelWidth = Math.round(width * dpr);
            const pixelHeight = Math.round(height * dpr);

            guideCanvas.width = pixelWidth;
            guideCanvas.height = pixelHeight;
            drawCanvas.width = pixelWidth;
            drawCanvas.height = pixelHeight;
            debugCanvas.width = pixelWidth;
            debugCanvas.height = pixelHeight;

            canvasWidth = pixelWidth;
            canvasHeight = pixelHeight;

            guideCtx.setTransform(1, 0, 0, 1, 0, 0);
            guideCtx.scale(dpr, dpr);
            drawCtx.setTransform(1, 0, 0, 1, 0, 0);
            drawCtx.scale(dpr, dpr);
            debugCtx.setTransform(1, 0, 0, 1, 0, 0);
            debugCtx.scale(dpr, dpr);

            drawGuide();
            redrawUserStrokes();
            if (debugVisible) drawDebugPath();
        }

        // ---------- Guide character (grey, Kai style) ----------
        function drawGuide() {
            const w = guideCanvas.width / dpr;
            const h = guideCanvas.height / dpr;
            guideCtx.clearRect(0, 0, w, h);
            const fontSize = Math.min(w, h) * 0.72;
            guideCtx.font = `${fontSize}px ${KAI_FONT_STACK}`;
            guideCtx.textAlign = 'center';
            guideCtx.textBaseline = 'middle';
            guideCtx.fillStyle = '#b8a99a';
            guideCtx.globalAlpha = 0.55;
            guideCtx.fillText(currentChar, w / 2, h / 2 + fontSize * 0.02);
            guideCtx.globalAlpha = 1.0;
        }

        // ---------- Debug path visualization (light pink) ----------
        // Renders exactly what scoring compares against (sharp mask, no blur).
        function drawDebugPath() {
            const w = debugCanvas.width / dpr;
            const h = debugCanvas.height / dpr;
            debugCtx.clearRect(0, 0, w, h);

            const offscreen = document.createElement('canvas');
            offscreen.width = COMP_SIZE;
            offscreen.height = COMP_SIZE;
            const oCtx = offscreen.getContext('2d');
            oCtx.fillStyle = '#000';
            oCtx.fillRect(0, 0, COMP_SIZE, COMP_SIZE);
            const fontSize = COMP_SIZE * 0.72;
            oCtx.font = `${fontSize}px ${KAI_FONT_STACK}`;
            oCtx.textAlign = 'center';
            oCtx.textBaseline = 'middle';
            oCtx.fillStyle = '#fff';
            oCtx.fillText(currentChar, COMP_SIZE / 2, COMP_SIZE / 2 + fontSize * 0.02);

            const imageData = oCtx.getImageData(0, 0, COMP_SIZE, COMP_SIZE);
            const data = imageData.data;
            const pinkImage = debugCtx.createImageData(COMP_SIZE, COMP_SIZE);
            const pinkData = pinkImage.data;
            for (let i = 0; i < data.length; i += 4) {
                if (data[i] > 100) {
                    pinkData[i] = 255;
                    pinkData[i + 1] = 182;
                    pinkData[i + 2] = 193;
                    pinkData[i + 3] = 220;
                } else {
                    pinkData[i + 3] = 0;
                }
            }
            const pinkCanvas = document.createElement('canvas');
            pinkCanvas.width = COMP_SIZE;
            pinkCanvas.height = COMP_SIZE;
            pinkCanvas.getContext('2d').putImageData(pinkImage, 0, 0);

            debugCtx.imageSmoothingEnabled = true;
            debugCtx.drawImage(pinkCanvas, 0, 0, w, h);
        }

        function showDebugPath() {
            drawDebugPath();
            debugCanvas.classList.add('visible');
            debugVisible = true;
            if (debugTimer) clearTimeout(debugTimer);
            debugTimer = setTimeout(() => {
                debugCanvas.classList.remove('visible');
                debugVisible = false;
                debugTimer = null;
            }, 3000);
        }

        function hideDebugPath() {
            if (debugTimer) {
                clearTimeout(debugTimer);
                debugTimer = null;
            }
            debugCanvas.classList.remove('visible');
            debugVisible = false;
        }

        // Keep drawn strokes proportional as the canvas grows or shrinks.
        function getBrushWidth() {
            return Math.max(5, (drawCanvas.width / dpr) * 0.028);
        }
        function getBrushRadius() {
            return getBrushWidth() / 2;
        }

        // ---------- Redraw user strokes ----------
        function redrawUserStrokes() {
            const w = drawCanvas.width / dpr;
            const h = drawCanvas.height / dpr;
            drawCtx.clearRect(0, 0, w, h);
            if (allStrokes.length === 0) return;

            drawCtx.lineWidth = getBrushWidth();
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.strokeStyle = '#2b1d12';
            drawCtx.shadowColor = 'rgba(0,0,0,0.1)';
            drawCtx.shadowBlur = 4;
            drawCtx.shadowOffsetY = 1;

            for (let stroke of allStrokes) {
                if (stroke.length < 2) continue;
                drawCtx.beginPath();
                drawCtx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) {
                    drawCtx.lineTo(stroke[i].x, stroke[i].y);
                }
                drawCtx.stroke();
            }
            for (let stroke of allStrokes) {
                if (stroke.length === 1) {
                    drawCtx.beginPath();
                    drawCtx.arc(stroke[0].x, stroke[0].y, getBrushRadius(), 0, 2 * Math.PI);
                    drawCtx.fillStyle = '#2b1d12';
                    drawCtx.fill();
                }
            }
            drawCtx.shadowColor = 'transparent';
            drawCtx.shadowBlur = 0;
            drawCtx.shadowOffsetY = 0;
            strokeCountSpan.textContent = allStrokes.length;
        }

        // ---------- Coordinate conversion ----------
        function getCanvasCoords(e) {
            const rect = drawCanvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches) {
                if (e.touches.length === 0) return null;
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const scaleX = canvasWidth / dpr / rect.width;
            const scaleY = canvasHeight / dpr / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            return {
                x: Math.min(Math.max(x, 0), canvasWidth / dpr),
                y: Math.min(Math.max(y, 0), canvasHeight / dpr)
            };
        }

        // ---------- Drawing events ----------
        function startDrawing(e) {
            e.preventDefault();
            const coords = getCanvasCoords(e);
            if (!coords) return;
            hideDebugPath();

            isDrawing = true;
            strokePoints = [{ x: coords.x, y: coords.y }];
            allStrokes.push(strokePoints);

            drawCtx.beginPath();
            drawCtx.arc(coords.x, coords.y, getBrushRadius(), 0, 2 * Math.PI);
            drawCtx.fillStyle = '#2b1d12';
            drawCtx.fill();

            redrawUserStrokes();
            lastX = coords.x;
            lastY = coords.y;
        }

        function draw(e) {
            e.preventDefault();
            if (!isDrawing) return;
            const coords = getCanvasCoords(e);
            if (!coords) return;

            const { x, y } = coords;
            strokePoints.push({ x, y });

            drawCtx.beginPath();
            drawCtx.moveTo(lastX, lastY);
            drawCtx.lineTo(x, y);
            drawCtx.lineWidth = getBrushWidth();
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.strokeStyle = '#2b1d12';
            drawCtx.shadowColor = 'rgba(0,0,0,0.1)';
            drawCtx.shadowBlur = 4;
            drawCtx.shadowOffsetY = 1;
            drawCtx.stroke();
            drawCtx.shadowColor = 'transparent';
            drawCtx.shadowBlur = 0;
            drawCtx.shadowOffsetY = 0;

            lastX = x;
            lastY = y;
            strokeCountSpan.textContent = allStrokes.length;
        }

        function stopDrawing(e) {
            e.preventDefault();
            if (!isDrawing) return;
            isDrawing = false;

            if (strokePoints.length <= 1) {
                allStrokes.pop();
                strokePoints = [];
                redrawUserStrokes();
            } else {
                strokePoints = [];
            }
            strokeCountSpan.textContent = allStrokes.length;
            clearScore();
        }

        function clearScore() {
            scoreDisplay.innerHTML = '—<small>%</small>';
            feedbackMsg.textContent = 'Tap "Score" to see your accuracy';
            strokeInfo.textContent = '';
        }

        function clearCanvas() {
            allStrokes = [];
            strokePoints = [];
            isDrawing = false;
            redrawUserStrokes();
            clearScore();
            hideDebugPath();
            strokeCountSpan.textContent = '0';
            feedbackMsg.textContent = 'Tap "Score" to see your accuracy';
            strokeInfo.textContent = '';
        }

        // ---------- Distance transform (2-pass chamfer, approx Euclidean) ----------
        // mask: Uint8Array where 1 = source pixel (distance 0)
        // Returns Float32Array of distances (0 at source pixels)
        function distanceTransform(mask, W, H) {
            const INF = 1e9;
            const SQ2 = 1.41421356;
            const dist = new Float32Array(W * H);
            for (let i = 0; i < W * H; i++) {
                dist[i] = mask[i] ? 0 : INF;
            }
            // Forward pass (top-left → bottom-right)
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    const i = y * W + x;
                    if (y > 0) { const v = dist[i - W] + 1; if (v < dist[i]) dist[i] = v; }
                    if (x > 0) { const v = dist[i - 1] + 1; if (v < dist[i]) dist[i] = v; }
                    if (y > 0 && x > 0) { const v = dist[i - W - 1] + SQ2; if (v < dist[i]) dist[i] = v; }
                    if (y > 0 && x < W - 1) { const v = dist[i - W + 1] + SQ2; if (v < dist[i]) dist[i] = v; }
                }
            }
            // Backward pass (bottom-right → top-left)
            for (let y = H - 1; y >= 0; y--) {
                for (let x = W - 1; x >= 0; x--) {
                    const i = y * W + x;
                    if (y < H - 1) { const v = dist[i + W] + 1; if (v < dist[i]) dist[i] = v; }
                    if (x < W - 1) { const v = dist[i + 1] + 1; if (v < dist[i]) dist[i] = v; }
                    if (y < H - 1 && x < W - 1) { const v = dist[i + W + 1] + SQ2; if (v < dist[i]) dist[i] = v; }
                    if (y < H - 1 && x > 0) { const v = dist[i + W - 1] + SQ2; if (v < dist[i]) dist[i] = v; }
                }
            }
            return dist;
        }

        // ---------- Renders current character into a fresh compSize mask ----------
        function renderGuideMask() {
            const c = document.createElement('canvas');
            c.width = COMP_SIZE; c.height = COMP_SIZE;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, COMP_SIZE, COMP_SIZE);
            const fontSize = COMP_SIZE * 0.72;
            ctx.font = `${fontSize}px ${KAI_FONT_STACK}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            ctx.fillText(currentChar, COMP_SIZE / 2, COMP_SIZE / 2 + fontSize * 0.02);

            const data = ctx.getImageData(0, 0, COMP_SIZE, COMP_SIZE).data;
            const mask = new Uint8Array(COMP_SIZE * COMP_SIZE);
            let count = 0;
            for (let i = 0; i < COMP_SIZE * COMP_SIZE; i++) {
                if (data[i * 4] > 100) { mask[i] = 1; count++; }
            }
            return { mask, count };
        }

        // ---------- Renders user strokes into a compSize mask ----------
        // IMPORTANT: uses CSS-pixel scaling so strokes line up with the guide.
        function renderUserMask() {
            const cssW = guideCanvas.width / dpr;
            const cssH = guideCanvas.height / dpr;
            const scaleX = COMP_SIZE / cssW;
            const scaleY = COMP_SIZE / cssH;

            const c = document.createElement('canvas');
            c.width = COMP_SIZE; c.height = COMP_SIZE;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, COMP_SIZE, COMP_SIZE);
            ctx.save();
            ctx.scale(scaleX, scaleY);
            ctx.lineWidth = cssW * 0.028;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#fff';

            for (let stroke of allStrokes) {
                if (stroke.length < 2) continue;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo(stroke[i].x, stroke[i].y);
                }
                ctx.stroke();
            }
            for (let stroke of allStrokes) {
                if (stroke.length === 1) {
                    ctx.beginPath();
                    ctx.arc(stroke[0].x, stroke[0].y, cssW * 0.014, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                }
            }
            ctx.restore();

            const data = ctx.getImageData(0, 0, COMP_SIZE, COMP_SIZE).data;
            const mask = new Uint8Array(COMP_SIZE * COMP_SIZE);
            let count = 0;
            for (let i = 0; i < COMP_SIZE * COMP_SIZE; i++) {
                if (data[i * 4] > 100) { mask[i] = 1; count++; }
            }
            return { mask, count };
        }

        // ---------- Scoring ----------
        // Measures how well the drawn path follows the guide path.
        // Two symmetric measures:
        //   userScore  = avg distance from each user pixel to the nearest guide pixel
        //   guideScore = avg distance from each guide pixel to the nearest user pixel
        // These are combined geometrically. Random scribbles score low on userScore
        // because most of their ink is far from the guide path; proper tracing scores
        // high on both.
        function calculateScore() {
            if (allStrokes.length === 0) return { score: 0 };

            const guide = renderGuideMask();
            if (guide.count === 0) return { score: 0 };
            const user = renderUserMask();
            if (user.count === 0) return { score: 0 };

            const distToGuide = distanceTransform(guide.mask, COMP_SIZE, COMP_SIZE);
            const distToUser  = distanceTransform(user.mask,  COMP_SIZE, COMP_SIZE);

            // Clamp distances so one far-away outlier can't dominate the average
            const MAX_D = 60;

            let sumUserDist = 0;
            for (let i = 0; i < COMP_SIZE * COMP_SIZE; i++) {
                if (user.mask[i]) {
                    let d = distToGuide[i];
                    if (d > MAX_D) d = MAX_D;
                    sumUserDist += d;
                }
            }
            const avgUserDist = sumUserDist / user.count;

            let sumGuideDist = 0;
            for (let i = 0; i < COMP_SIZE * COMP_SIZE; i++) {
                if (guide.mask[i]) {
                    let d = distToUser[i];
                    if (d > MAX_D) d = MAX_D;
                    sumGuideDist += d;
                }
            }
            const avgGuideDist = sumGuideDist / guide.count;

            // Convert averages into 0..1 sub-scores.
            // Larger divisor = more forgiving.
            const USER_DIV = 14;
            const GUIDE_DIV = 18;
            const userScore  = Math.exp(-avgUserDist  / USER_DIV);
            const guideScore = Math.exp(-avgGuideDist / GUIDE_DIV);

            // Weighted geometric mean — path accuracy dominates.
            const combined = Math.pow(userScore, 0.55) * Math.pow(guideScore, 0.45);

            let scorePercent = Math.round(combined * 100);
            scorePercent = Math.min(100, Math.max(0, scorePercent));

            return {
                score: scorePercent,
                avgUserDist: Math.round(avgUserDist * 10) / 10,
                avgGuideDist: Math.round(avgGuideDist * 10) / 10
            };
        }

        function checkScore() {
            if (allStrokes.length === 0) {
                scoreDisplay.innerHTML = '0<small>%</small>';
                feedbackMsg.textContent = '✏️ Please write something first';
                strokeInfo.textContent = '';
                return;
            }

            const result = calculateScore();
            scoreDisplay.innerHTML = `${result.score}<small>%</small>`;

            let feedback = '';
            if (result.score >= 90) feedback = '🌟 Amazing! You followed the strokes perfectly!';
            else if (result.score >= 75) feedback = '🎉 Great job! Very close to the path!';
            else if (result.score >= 60) feedback = '😊 Good try! Keep following the grey lines!';
            else if (result.score >= 40) feedback = '💪 Nice start! Trace slowly along the strokes';
            else feedback = '🖌️ Let\'s try again — stay on the grey paths!';

            feedbackMsg.textContent = feedback;

            const charData = CHARACTERS[currentIndex];
            const correctStrokes = charData.strokeCount;
            const userStrokes = allStrokes.length;

            let strokeMessage = `Correct: ${correctStrokes} strokes. `;
            if (userStrokes === correctStrokes) {
                strokeMessage += '✅ Perfect stroke count!';
            } else if (userStrokes < correctStrokes) {
                strokeMessage += `You wrote ${userStrokes} — try to use ${correctStrokes}.`;
            } else {
                strokeMessage += `You wrote ${userStrokes} — aim for ${correctStrokes}.`;
            }

            strokeInfo.innerHTML =
                `<span class="stroke-number">Stroke order:</span> ${charData.strokeOrder}<br>` +
                `<span class="stroke-number">Stroke count:</span> ${strokeMessage}`;

            showDebugPath();
        }

        // ---------- Character switching ----------
        function setCharacter(index) {
            currentIndex = index;
            currentChar = CHARACTERS[index].char;
            const data = CHARACTERS[index];

            currentCharDisplay.textContent = currentChar;
            pinyinDisplay.textContent = data.pinyin;
            starDisplay.style.display = data.challenge ? 'inline' : 'none';

            clearCanvas();
            drawGuide();

            document.querySelectorAll('.word-btn').forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function buildWordSelector() {
            wordSelector.innerHTML = '';
            CHARACTERS.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = 'word-btn' + (idx === currentIndex ? ' active' : '');
                const charSpan = document.createElement('span');
                charSpan.textContent = item.char;
                btn.appendChild(charSpan);
                if (item.challenge) {
                    const starSpan = document.createElement('span');
                    starSpan.className = 'challenge-star';
                    starSpan.textContent = '★';
                    btn.appendChild(starSpan);
                }
                btn.setAttribute('aria-label', `Practice ${item.char} ${item.pinyin}`);
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    setCharacter(idx);
                });
                wordSelector.appendChild(btn);
            });
        }

        function bindEvents() {
            drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
            drawCanvas.addEventListener('touchmove', draw, { passive: false });
            drawCanvas.addEventListener('touchend', stopDrawing);
            drawCanvas.addEventListener('touchcancel', stopDrawing);

            drawCanvas.addEventListener('mousedown', startDrawing);
            drawCanvas.addEventListener('mousemove', draw);
            drawCanvas.addEventListener('mouseup', stopDrawing);
            drawCanvas.addEventListener('mouseleave', stopDrawing);

            clearBtn.addEventListener('click', (e) => {
                e.preventDefault();
                clearCanvas();
            });
            checkBtn.addEventListener('click', (e) => {
                e.preventDefault();
                checkScore();
            });
            window.addEventListener('resize', () => {
                resizeCanvas();
                clearScore();
            });
        }

        function init() {
            buildWordSelector();
            currentChar = CHARACTERS[0].char;
            currentCharDisplay.textContent = currentChar;
            pinyinDisplay.textContent = CHARACTERS[0].pinyin;
            starDisplay.style.display = CHARACTERS[0].challenge ? 'inline' : 'none';

            resizeCanvas();
            drawGuide();
            bindEvents();
            redrawUserStrokes();
            clearScore();
            strokeCountSpan.textContent = '0';
        }

        window.addEventListener('load', () => {
            // Wait for the downloadable Kai-style font before rendering canvas text.
            const fontReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
            fontReady.finally(() => setTimeout(init, 20));
        });

        document.body.addEventListener('touchmove', (e) => {
            if (e.target.closest('.canvas-wrapper')) e.preventDefault();
        }, { passive: false });
    })();
</script>
</body>
</html>
